<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息接收</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    #status { font-size: 12px; font-weight: 400; opacity: 0.7; margin-left: 8px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); animation: fadeIn 0.3s ease; }
    .msg .time { font-size: 12px; color: #999; margin-top: 4px; }
    .msg .actions { margin-top: 6px; display: flex; gap: 6px; }
    .msg .actions button { background: none; border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; font-size: 12px; color: #888; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .msg .actions button:hover { background: #f0f0f0; color: #333; }
    .msg .actions .copied { color: #4caf50; border-color: #4caf50; }
    .empty { text-align: center; color: #aaa; margin-top: 40vh; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>
    消息接收
    <span id="status">连接中...</span>
  </header>
  <div id="messages">
    <div class="empty" id="placeholder">等待消息...</div>
  </div>
  <script>
    var messagesEl = document.getElementById("messages");
    var statusEl = document.getElementById("status");

    function escapeHtml(str) {
      var d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function createMsgEl(m) {
      var div = document.createElement("div");
      div.className = "msg";
      div.dataset.id = m.id;
      div.dataset.raw = m.message;
      div.innerHTML =
        '<div class="msg-text">' + escapeHtml(m.message).replace(/\n/g, '<br>') + '</div>' +
        '<div class="time">' + escapeHtml(m.time) + '</div>' +
        '<div class="actions">' +
          '<button class="copy-btn" onclick="copyMsg(this)">复制</button>' +
        '</div>';
      return div;
    }

    function renderAll(msgs) {
      messagesEl.innerHTML = "";
      if (msgs.length === 0) {
        messagesEl.innerHTML = '<div class="empty">等待消息...</div>';
        return;
      }
      msgs.forEach(function(m) { messagesEl.appendChild(createMsgEl(m)); });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    window.copyMsg = function(btn) {
      var text = btn.closest(".msg").dataset.raw;
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      btn.textContent = "已复制";
      btn.classList.add("copied");
      setTimeout(function() { btn.textContent = "复制"; btn.classList.remove("copied"); }, 1500);
    };

    function connect() {
      var ws = new WebSocket("ws://" + location.host);
      ws.onopen = function() {
        statusEl.textContent = "已连接";
        statusEl.style.color = "#4caf50";
      };
      ws.onclose = function() {
        statusEl.textContent = "已断开，重连中...";
        statusEl.style.color = "#ff9800";
        setTimeout(connect, 2000);
      };
      ws.onerror = function() { ws.close(); };
      ws.onmessage = function(e) {
        var data = JSON.parse(e.data);
        if (data.type === "message") {
          var placeholder = messagesEl.querySelector(".empty");
          if (placeholder) placeholder.remove();
          messagesEl.appendChild(createMsgEl(data));
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (data.type === "delete") {
          var el = messagesEl.querySelector('[data-id="' + data.id + '"]');
          if (el) el.remove();
          if (!messagesEl.querySelector(".msg")) {
            messagesEl.innerHTML = '<div class="empty">等待消息...</div>';
          }
        }
      };
    }

    fetch("/messages").then(function(r) { return r.json(); }).then(renderAll);
    connect();
  </script>
</body>
</html>
