<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息接收</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    #status { font-size: 12px; font-weight: 400; opacity: 0.7; margin-left: 8px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); animation: fadeIn 0.3s ease; }
    .msg .time { font-size: 12px; color: #999; margin-top: 4px; }
    .empty { text-align: center; color: #aaa; margin-top: 40vh; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>
    消息接收
    <span id="status">连接中...</span>
  </header>
  <div id="messages">
    <div class="empty" id="placeholder">等待消息...</div>
  </div>
  <script>
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const placeholder = document.getElementById("placeholder");

    function connect() {
      const ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => { statusEl.textContent = "已连接"; statusEl.style.color = "#4caf50"; };
      ws.onclose = () => {
        statusEl.textContent = "已断开，重连中...";
        statusEl.style.color = "#ff9800";
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (e) => {
        if (placeholder) placeholder.remove();
        const { message, time } = JSON.parse(e.data);
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<div>${escapeHtml(message)}</div><div class="time">${time}</div>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      };
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    connect();
  </script>
</body>
</html>
