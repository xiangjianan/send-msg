<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发送消息</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 16px 24px; font-size: 18px; font-weight: 600; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #fff; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); animation: fadeIn 0.3s ease; }
    .msg .time { font-size: 12px; color: #999; margin-top: 4px; }
    .empty { text-align: center; color: #aaa; margin-top: 40vh; }
    .input-bar { padding: 16px 24px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; }
    .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
    .input-bar input:focus { border-color: #1a1a2e; }
    .input-bar button { padding: 12px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    .input-bar button:hover { background: #16213e; }
    .input-bar button:active { background: #0f3460; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>发送消息</header>
  <div id="messages">
    <div class="empty" id="placeholder">发送第一条消息吧</div>
  </div>
  <div class="input-bar">
    <input id="input" type="text" placeholder="输入消息..." autofocus />
    <button id="btn">发送</button>
  </div>
  <script>
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");
    const messagesEl = document.getElementById("messages");
    const placeholder = document.getElementById("placeholder");

    async function send() {
      const message = input.value.trim();
      if (!message) return;

      const res = await fetch("/broadcast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      const data = await res.json();
      if (data.ok) {
        if (placeholder) placeholder.remove();
        const now = new Date().toLocaleTimeString();
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<div>${escapeHtml(message)}</div><div class="time">${now} · 已推送到 ${data.recipients} 个客户端</div>`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        input.value = "";
      }
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    btn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
